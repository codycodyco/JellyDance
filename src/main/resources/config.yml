# Authored dances live in plugins/JellyDance/dances/*.yml.
# Edit one, then /dance reload; /dance start <radius> <name>.
#
# How a dance hides the vanilla entity.
#
# protocol  - Paper's per-player entity tracking: hideEntity() for everybody
#             online and PlayerTrackEntityEvent cancelled for newcomers. The
#             entity itself is untouched, so AI, collision, position and
#             identity keep running; nobody receives its spawn packet.
# invisible - vanilla invisibility flag, for a server that cannot use the
#             protocol path. Name tag and glow are suppressed and restored.
hide-mode: protocol

dance:
  radius: 12.0
  max-participants: 60
  # Client interpolation, in ticks. 2 is smooth without lagging behind.
  interpolation-ticks: 2
  # ItemDisplay view range multiplier (1.0 is the vanilla default).
  view-range: 1.0

  # Root every dancer in place: suspend its AI, zero velocity, lock the facing
  # and pull it back to the anchor if anything pushes it. Restored when the
  # dance ends. Known crash risk: if the server dies mid-dance the NoAI flag
  # stays on the entity until it is cleared.
  freeze-in-place: true
  freeze-tolerance: 0.05
  debug: false

# Experimental, not a camera API: oscillates nearby players' walk-speed
# attribute. It also changes movement speed while active, so it is off by default.
screen-shake:
  enabled: false
  amplitude: 0.02     # walk-speed delta around the player's original value
  frequency: 8.0      # oscillation cycles per second
  radius: 16.0        # players around the dance center
